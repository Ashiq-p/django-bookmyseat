{% extends "users/basic.html" %}

{% block title %}Confirm Delete | Custom Admin{% endblock %}

{% block content %}
<div class="py-5 col-md-6 mx-auto">
    <div class="card border-0 shadow-lg rounded-lg text-center p-4">
        <div class="card-body">
            <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
            <h3 class="font-weight-bold mb-2">Confirm Deletion</h3>
            <p class="text-muted lead">Are you sure you want to delete {{ type }} <strong>"{{ object.name }}"</strong>?</p>
            <p class="small text-danger">This action cannot be undone and will remove associated data.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="javascript:history.back()" class="btn btn-secondary px-4 mr-2">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 font-weight-bold">Delete Forever</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
